stac:
  url: https://stac.dataspace.copernicus.eu/v1
  sign: null  # CDSE has no URL signing, assets are read from S3
  # S3 keys (https://eodata-s3keysmanager.dataspace.copernicus.eu/) come from the
  # environment: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, e.g. `uv run --env-file .env`
  gdal:
    AWS_S3_ENDPOINT: eodata.dataspace.copernicus.eu
    AWS_VIRTUAL_HOSTING: "FALSE"
    AWS_HTTPS: "YES"

collection: sentinel-2-l2a
platforms: null  # e.g. [sentinel-2a, sentinel-2b], null = all platforms of the collection
# alias -> asset key, swap per collection
bands:
  red: B04_10m
  green: B03_10m
  blue: B02_10m
nodata: 0
# "s2_offset only for baseline ≥ 04.00".
# reflectance = (DN - s2_offset) * scale + offset
scale: 0.0001
offset: 0.0
harmonize_s2_offset: true  # subtract 1000 DN for processing baseline >= 04.00 (like GEE S2_SR_HARMONIZED)

time:
  start: "2023-06-01"
  end: "2023-06-15"

max_cloud_cover: 20  # scene cloud cover filter in %, property per collection (stac.CLOUD_COVER_PROPERTY), null = off

sites:
  path: data/E-Sites.gpkg
  layer: esites
  id_field: name

load:
  crs: EPSG:32632
  resolution: 10
  buffer_m: 50
  chunks: {x: 2048, y: 2048}

aggregate:
  freq: 1D
  reducer: median  # median | mean | min | max | std | first | last

dask:
  distributed: false     # true = LocalCluster (processes), false = threaded scheduler
  num_threads: null      # threaded scheduler only, null = number of CPU cores
  n_workers: 4           # LocalCluster only
  threads_per_worker: 4  # LocalCluster only
  memory_limit: auto     # per worker, e.g. 4GiB

raster:
  enabled: true  # also write the reduced scenes over the sites window as GeoTIFF, one per aggregate.freq period

count_only: false  # only search + report collection size, no pixel loading
out_dir: out
