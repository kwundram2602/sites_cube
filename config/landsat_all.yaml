stac:
  url: https://planetarycomputer.microsoft.com/api/stac/v1
  sign: planetary_computer  # null for endpoints without URL signing
  gdal: null  # extra GDAL config options for reading assets, e.g. S3 endpoint

collection: landsat-c2-l2
# TM (4/5), ETM+ (7), OLI (8/9); MSS (1-3) is not in landsat-c2-l2
platforms: [landsat-4, landsat-5, landsat-7, landsat-8, landsat-9]
# alias -> asset key, swap per collection
bands:  # common names as aliases, needed for the Landsat QA mask and harmonisation
  blue: blue
  green: green
  red: red
  nir08: nir08
  swir16: swir16
  swir22: swir22
nodata: 0
# reflectance = DN * scale + offset (Collection 2 Level-2 SR)
scale: 0.0000275
offset: -0.2
#harmonize_s2_offset: false  # S2 only
landsat:
  qa_mask: true          # load qa_pixel/qa_radsat; mask fill (always), the flags below, SR outside [0,1]
  # QA_PIXEL flags masked in all bands: dilated_cloud | cirrus (OLI only) | cloud | cloud_shadow | snow
  # all five = filtering of Roy et al. 2016;
  qa_pixel_flags: [dilated_cloud, cirrus, cloud, cloud_shadow, snow]
  mask_saturation: true  # QA_RADSAT: saturated band only, ETM+ dropped / OLI occluded pixel all bands
  harmonize: null         # oli | etm | null, ETM+/TM <-> OLI after Roy et al. 2016, Table 2
  harmonize_method: ols  # ols (means, composites) | rma (thresholds, distributions)
  out_of_range: nan      # nan | clip | keep, for transformed values outside [0,1]
  tm_as_etm: true        # TM is not in the paper, transform it with the ETM+ coefficients (warns)

# quality layers, alias -> asset key: written unscaled next to the bands (NaN outside
# the item footprint); only with aggregate.enabled: false
#quality: null
quality:
  qa_pixel: qa_pixel  # independent of landsat.qa_mask

time:
  start: "2009-07-01"
  end: "2010-09-30"

max_cloud_cover: 60  # scene cloud cover filter in %, property per collection (stac.CLOUD_COVER_PROPERTY), null = off

sites:
  path: data/E-Sites.gpkg
  layer: esites
  id_field: name

load:
  crs: EPSG:32632
  resolution: 30
  buffer_m: 50
  # output pixel grid, must match the source grid or reads shift by half a pixel:
  # edge = pixel edges on multiples of the resolution, center = pixel centers
  anchor: center  # Landsat C2: pixel centers on multiples of 30 m
  # fixed load window instead of the buffered sites extent (sites outside are dropped):
  # [xmin, ymin, xmax, ymax] in load.crs on the pixel edges of the anchor grid, or a path to a
  # vector/raster bounds file (reprojected, snapped outward to the grid); null = sites
  bbox: null
  chunks: {x: 2048, y: 2048}
  read_retries: 2  # repeat the whole load after a failed raster read (e.g. truncated download)

aggregate:
  enabled: false  # false = one row/GeoTIFF per STAC item (no solar-day fusion), required for `quality`
  freq: 1MS # 1D | 1MS | 1M | 1Y
  reducer: median  # median | mean | min | max | std | first | last

dask:
  distributed: true     # true = LocalCluster (processes), false = threaded scheduler
  num_threads: null      # threaded scheduler only, null = number of CPU cores
  n_workers: 4           # LocalCluster only
  threads_per_worker: 4  # LocalCluster only
  memory_limit: auto     # per worker, e.g. 4GiB

raster:
  enabled: true  # one GeoTIFF per month over ~44 years would be large; enable for shorter periods

merged_csv: false  # also write one CSV with all sites next to the site CSV folder, e.g. <collection>/sites_items.csv

count_only: false  # only search + report collection size, no pixel loading
out_dir: out
