stac:
  url: https://planetarycomputer.microsoft.com/api/stac/v1
  # PC serves older scenes in their original processing (e.g. 2016: baseline 02.12,
  # no geometric refinement), found 1 px (10 m) off the reprocessed product;
  # config/sentinel2_cdse.yaml reads CDSE Collection-1 (05.xx) instead
  sign: planetary_computer  # null for endpoints without URL signing
  gdal: null  # extra GDAL config options for reading assets, e.g. S3 endpoint

collection: sentinel-2-l2a
platforms: null  # e.g. [sentinel-2a, sentinel-2b], null = all platforms of the collection
# alias -> asset key, all 10 m and 20 m bands; 20 m bands are resampled (nearest) to load.resolution
bands:
  blue: B02
  green: B03
  red: B04
  rededge1: B05
  rededge2: B06
  rededge3: B07
  nir: B08
  nir08: B8A
  swir16: B11
  swir22: B12
nodata: 0
# "s2_offset only for baseline ≥ 04.00".
# reflectance = (DN - s2_offset) * scale + offset
scale: 0.0001
offset: 0.0
harmonize_s2_offset: true  # subtract 1000 DN for processing baseline >= 04.00 (like GEE S2_SR_HARMONIZED)

# quality layers, alias -> asset key: written unscaled next to the bands (NaN outside
# the item footprint); only with aggregate.enabled: false
# Planetary Computer has no cloud/snow probabilities (CDSE: CLD_20m, SNW_20m)
quality:
  scl: SCL

time:
  start: "2015-01-01"
  end: "2016-12-31"

max_cloud_cover: null  # scene cloud cover filter in %, property per collection (stac.CLOUD_COVER_PROPERTY), null = off

sites:
  path: data/E-Sites.gpkg
  layer: esites
  id_field: name

load:
  crs: EPSG:32632
  resolution: 10
  buffer_m: 50
  # output pixel grid, must match the source grid or reads shift by half a pixel:
  # edge = pixel edges on multiples of the resolution, center = pixel centers
  anchor: edge  # S2: pixel edges on multiples of 10/20/60 m
  # fixed load window instead of the buffered sites extent (sites outside are dropped):
  # [xmin, ymin, xmax, ymax] in load.crs on the pixel edges of the anchor grid, or a path to a
  # vector/raster bounds file (reprojected, snapped outward to the grid); null = sites
  bbox: null
  chunks: {x: 2048, y: 2048}
  read_retries: 2  # repeat the whole load after a failed raster read (e.g. truncated download)

aggregate:
  enabled: false  # false = one row/GeoTIFF per STAC item (no solar-day fusion), required for `quality`
  freq: 1MS
  reducer: median  # median | mean | min | max | std | first | last

dask:
  distributed: true     # true = LocalCluster (processes), false = threaded scheduler
  num_threads: null      # threaded scheduler only, null = number of CPU cores
  n_workers: 4           # LocalCluster only
  threads_per_worker: 4  # LocalCluster only
  memory_limit: auto     # per worker, e.g. 4GiB

raster:
  enabled: true  # also write the scenes over the sites window as GeoTIFF, one per item (aggregation off) or aggregate.freq period

merged_csv: false  # also write one CSV with all sites next to the site CSV folder, e.g. <collection>/sites_items.csv

count_only: false  # only search + report collection size, no pixel loading
out_dir: out
