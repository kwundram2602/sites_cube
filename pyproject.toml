[project]
name = "sites-cube"
version = "0.1.0"
description = "Point time series extraction from STAC collections"
authors = [
    { name = "Kjell Wundram", email = "kjell.wundram@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dask>=2026.8.0",
    "geopandas>=1.2.0",
    "odc-stac>=0.5.3",
    "omegaconf>=2.3.1",
    "pandas>=3.0.6",
    "planetary-computer>=1.0.0",
    "pyarrow>=25.0.1",
    "pyogrio>=0.13.0",
    "pystac-client>=0.9.0",
    "xarray>=2026.9.0",
]

[project.scripts]
sites-cube = "sites_cube.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]
